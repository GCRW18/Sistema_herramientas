<div class="flex flex-col bg-white dark:bg-slate-900 border-[3px] border-black rounded-2xl overflow-hidden"
     style="width:min(640px,95vw); max-height:90vh;">

  <!-- Cabecera -->
  <div class="flex items-center justify-between gap-3 px-4 py-3 bg-[#0F172AFF] border-b-[3px] border-black shrink-0">
    <div class="flex items-center gap-2.5">
      <mat-icon class="!text-lg text-[#FFC501FF]">{{ isEdit ? 'edit' : 'flight' }}</mat-icon>
      <h2 class="text-sm font-black uppercase tracking-tight text-white">
        {{ isEdit ? 'Editar Aeronave' : 'Nueva Aeronave' }}
      </h2>
    </div>
    <button (click)="cancelar()" class="w-7 h-7 flex items-center justify-center rounded bg-white/10 hover:bg-red-500 transition-all">
      <mat-icon class="!text-sm text-white">close</mat-icon>
    </button>
  </div>

  <!-- Cuerpo -->
  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex-1 overflow-auto p-4 grid grid-cols-1 sm:grid-cols-2 gap-3">

    <div>
      <label class="field-label">Matrícula <span class="text-red-500">*</span></label>
      <input class="neo-input uppercase" formControlName="registration" placeholder="Ej: CP-2554" [class.opacity-60]="isEdit">
      <p *ngIf="hasError('registration','required')" class="text-[10px] font-bold text-red-500 mt-1">Requerido</p>
      <p *ngIf="isEdit" class="text-[9px] font-bold text-stone-400 mt-1">La matrícula no se puede editar</p>
    </div>
    <div>
      <label class="field-label">N.º de Serie</label>
      <input class="neo-input" formControlName="serial_number" placeholder="Número de serie">
    </div>

    <div>
      <label class="field-label">Fabricante <span class="text-red-500">*</span></label>
      <input class="neo-input" formControlName="manufacturer" placeholder="Ej: Boeing, Airbus">
      <p *ngIf="hasError('manufacturer','required')" class="text-[10px] font-bold text-red-500 mt-1">Requerido</p>
    </div>
    <div>
      <label class="field-label">Modelo <span class="text-red-500">*</span></label>
      <input class="neo-input" formControlName="model" placeholder="Ej: 737-800, A320">
      <p *ngIf="hasError('model','required')" class="text-[10px] font-bold text-red-500 mt-1">Requerido</p>
    </div>

    <div>
      <label class="field-label">Tipo</label>
      <select class="neo-select" formControlName="type">
        <option *ngFor="let t of tipos" [value]="t.value">{{ t.label }}</option>
      </select>
    </div>
    <div>
      <label class="field-label">Estado</label>
      <select class="neo-select" formControlName="status">
        <option *ngFor="let e of estados" [value]="e.value">{{ e.label }}</option>
      </select>
    </div>

    <div>
      <label class="field-label">
        Base
        <span *ngIf="loadingBases" class="w-3 h-3 border-2 border-amber-400 border-t-transparent rounded-full animate-spin inline-block align-middle ml-1"></span>
      </label>
      <select class="neo-select" formControlName="base_location">
        <option value="">— Sin definir —</option>
        <option *ngFor="let b of bases" [value]="b.nombre">{{ b.nombre }}{{ b.codigo ? ' (' + b.codigo + ')' : '' }}</option>
      </select>
    </div>
    <div>
      <label class="field-label">Flota</label>
      <input class="neo-input" formControlName="fleet_name" placeholder="Nombre de flota (opcional)">
    </div>

    <div class="sm:col-span-2">
      <label class="field-label">Observaciones</label>
      <textarea class="neo-input" formControlName="notes" rows="2" placeholder="Notas internas (opcional)"></textarea>
    </div>
  </form>

  <!-- Pie -->
  <div class="flex items-center justify-end gap-2 px-4 py-3 border-t-[3px] border-black bg-gray-50 dark:bg-slate-800 shrink-0">
    <button (click)="cancelar()"
            class="px-4 py-2 bg-white dark:bg-slate-700 text-black dark:text-white font-black text-xs uppercase border-2 border-black rounded-xl shadow-[3px_3px_0px_0px_#000] hover:translate-y-[1px] hover:shadow-none transition-all">
      Cancelar
    </button>
    <button (click)="guardar()"
            class="px-4 py-2 bg-[#FFC501FF] text-black font-black text-xs uppercase border-2 border-black rounded-xl shadow-[3px_3px_0px_0px_#000] hover:translate-y-[1px] hover:shadow-none transition-all flex items-center gap-1.5">
      <mat-icon class="!text-sm text-black">save</mat-icon>
      {{ isEdit ? 'Guardar cambios' : 'Registrar' }}
    </button>
  </div>
</div>
