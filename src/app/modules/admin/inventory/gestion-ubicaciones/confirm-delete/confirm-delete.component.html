<div class="bg-stone-100 dark:bg-slate-900 border-2 border-black rounded-2xl overflow-hidden flex flex-col"
     style="width:100%; max-height:90vh">

    <!-- HEADER -->
    <div class="bg-[#0F172A] px-3 sm:px-5 py-3 sm:py-3.5 flex items-center gap-3 shrink-0 select-none"
         cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle style="cursor:grab">
        <div class="w-9 h-9 rounded-lg bg-[#FF1414] border-2 border-black flex items-center justify-center shadow-[2px_2px_0_#000] shrink-0 shake-icon">
            <mat-icon class="!text-lg text-white">warning</mat-icon>
        </div>
        <div>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.18em] leading-none mb-0.5">Gestión de Ubicaciones</p>
            <h2 class="text-sm text-white font-black uppercase tracking-tight leading-none">{{ title }}</h2>
        </div>
    </div>

    <!-- BODY -->
    <div class="px-3 sm:px-5 py-4 sm:py-5 flex flex-col items-center text-center gap-4 bg-white dark:bg-slate-800 flex-1 overflow-y-auto">

        <div class="w-16 h-16 bg-[#FF1414] border-2 border-black rounded-full flex items-center justify-center shadow-[3px_3px_0_#000]">
            <mat-icon class="!text-3xl text-white">delete_forever</mat-icon>
        </div>

        <p class="text-sm font-bold text-black dark:text-white">
            ¿Está seguro de eliminar este <span class="uppercase font-black">{{ itemKind }}</span>?
        </p>

        <div class="bg-stone-100 dark:bg-slate-700 border-2 border-black rounded-xl px-4 py-3 shadow-[3px_3px_0_#000] w-full text-left">
            <p *ngIf="itemCode" class="text-[9px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-widest mb-0.5">Código</p>
            <p *ngIf="itemCode" class="font-mono font-black text-sm sm:text-base text-black dark:text-white break-all">{{ itemCode }}</p>
            <p *ngIf="itemName" class="text-sm font-bold text-black dark:text-gray-200 mt-1">{{ itemName }}</p>
        </div>

        <div *ngIf="warning"
             class="text-[11px] font-bold text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border-2 border-red-400 dark:border-red-600 rounded-xl px-3 py-2 w-full flex items-center gap-2 text-left">
            <mat-icon class="!text-sm text-red-500 shrink-0">info</mat-icon>
            <span>{{ warning }}</span>
        </div>

        <p class="text-[9px] font-black uppercase text-red-500 tracking-widest">Esta acción no se puede deshacer</p>
    </div>

    <!-- FOOTER -->
    <div class="border-t-2 border-black bg-stone-200 dark:bg-slate-800 px-3 sm:px-5 py-3 flex justify-between items-center shrink-0">
        <button (click)="cancel()"
                class="px-4 py-2 bg-[#FF1414] text-white font-black text-[10px] border-2 border-black rounded-xl shadow-[2px_2px_0_#000] hover:shadow-none hover:translate-x-[2px] hover:translate-y-[2px] transition-all uppercase">
            Cancelar
        </button>
        <button (click)="confirm()"
                class="flex items-center gap-2 px-5 py-2 bg-amber-400 text-black font-black text-[10px] border-2 border-black rounded-xl shadow-[3px_3px_0_#000] hover:shadow-none hover:translate-x-[3px] hover:translate-y-[3px] transition-all uppercase">
            <mat-icon class="!text-sm">delete_forever</mat-icon>
            {{ confirmLabel }}
        </button>
    </div>
</div>
