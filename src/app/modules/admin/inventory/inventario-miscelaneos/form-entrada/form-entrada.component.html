<div class="bg-stone-100 dark:bg-slate-900 border-2 border-black overflow-hidden flex flex-col"
     style="width:760px; max-width:95vw; max-height:88vh; box-shadow: 6px 6px 0 #000">

    <!-- HEADER -->
    <div class="bg-[#0F172A] px-4 py-2.5 flex items-center gap-3 shrink-0 select-none"
         cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle style="cursor:grab">
        <div class="w-8 h-8 rounded bg-amber-400 border-2 border-black flex items-center justify-center shadow-[2px_2px_0_#fbbf24] shrink-0">
            <mat-icon class="!text-base text-black">move_to_inbox</mat-icon>
        </div>
        <div>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.18em] leading-none mb-0.5">{{ subtitulo }}</p>
            <h2 class="text-sm text-white font-black uppercase tracking-tight leading-none">{{ titulo }}</h2>
        </div>
        <div class="ml-auto flex items-center gap-2 shrink-0">
            <button type="button" (click)="dialogRef.close(undefined)"
                    class="px-3 py-1.5 bg-[#FF1414] text-white font-black text-[10px] border-2 border-black rounded-lg shadow-[2px_2px_0_#000] hover:shadow-none hover:translate-x-[1px] hover:translate-y-[1px] transition-all uppercase">
                {{ readOnly ? 'Cerrar' : 'Cancelar' }}
            </button>
            <button *ngIf="!readOnly" type="button" (click)="save()"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-400 text-black font-black text-[10px] border-2 border-black rounded-lg shadow-[2px_2px_0_#000] hover:shadow-none hover:translate-x-[1px] hover:translate-y-[1px] transition-all uppercase">
                <mat-icon class="!text-xs !text-black">save</mat-icon>
                Registrar Entrada
            </button>
        </div>
    </div>

    <!-- BODY -->
    <div class="flex-1 overflow-y-auto px-4 py-4 custom-scrollbar">
        <form [formGroup]="form" class="grid grid-cols-1 lg:grid-cols-2 gap-4">

            <!-- CARD 1: Datos de Entrada -->
            <div class="flex flex-col">
                <div class="flex-1 bg-white dark:bg-slate-800 border-2 border-black rounded-xl p-3 shadow-[3px_3px_0_#000]">
                    <span class="text-[8px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-[0.18em] mb-3 border-b-2 border-black/10 pb-1.5 w-full block">
                        Datos de Entrada
                    </span>
                    <div class="grid grid-cols-12 gap-3">
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Nro. Nota *</label>
                            <input type="text" formControlName="nroNota" placeholder="NOTA-001"
                                   class="w-full h-10 text-sm font-black uppercase bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                                   [class]="hasError('nroNota','required')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <p *ngIf="hasError('nroNota','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                        </div>
                        <div class="col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Fecha *</label>
                            <input type="date" formControlName="fecha"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                                   [class]="hasError('fecha','required')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                        </div>
                        <div class="col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Hora</label>
                            <input type="time" formControlName="hora"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Recibido Por *</label>
                            <input type="text" formControlName="recibidoPor" placeholder="Nombre del receptor"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600"
                                   [class]="hasError('recibidoPor','required')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <p *ngIf="hasError('recibidoPor','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                        </div>
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Factura / Remisión</label>
                            <input type="text" formControlName="factura" placeholder="Nro. de factura"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Observaciones</label>
                            <textarea formControlName="observacion" rows="3" placeholder="Notas adicionales..."
                                      class="w-full text-sm font-normal bg-white dark:bg-slate-800 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 py-2.5 outline-none transition-all duration-150 resize-none placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000] custom-scrollbar"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CARD 2: Material Ingresado -->
            <div class="flex flex-col">
                <div class="flex-1 bg-white dark:bg-slate-800 border-2 border-black rounded-xl p-3 shadow-[3px_3px_0_#000]">
                    <span class="text-[8px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-[0.18em] mb-3 border-b-2 border-black/10 pb-1.5 w-full block">
                        Material Ingresado
                    </span>
                    <div class="grid grid-cols-12 gap-3">
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Código / Nombre *</label>
                            <input type="text" formControlName="codigoNombre" placeholder="BOA-M-001"
                                   class="w-full h-10 text-sm font-black uppercase bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                                   [class]="hasError('codigoNombre','required')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <p *ngIf="hasError('codigoNombre','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                        </div>
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Descripción del Producto *</label>
                            <input type="text" formControlName="producto" placeholder="Nombre completo del material"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600"
                                   [class]="hasError('producto','required')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <p *ngIf="hasError('producto','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                        </div>
                        <div class="col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Cantidad *</label>
                            <input type="number" formControlName="cantidad" min="1"
                                   class="w-full h-10 text-sm font-black text-center bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                                   [class]="hasError('cantidad','required') || hasError('cantidad','min')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                        </div>
                        <div class="col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Unidad *</label>
                            <select formControlName="unidad"
                                    class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 cursor-pointer appearance-none hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                                <option *ngFor="let u of unidades" [value]="u">{{ u }}</option>
                            </select>
                        </div>
                        <div class="col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">P/N</label>
                            <input type="text" formControlName="pn" placeholder="Part Number"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                        <div class="col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Marca</label>
                            <input type="text" formControlName="marca" placeholder="Fabricante"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Stock Actual (referencia)</label>
                            <input type="text" formControlName="stock" placeholder="Stock antes de entrada"
                                   class="w-full h-10 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>
