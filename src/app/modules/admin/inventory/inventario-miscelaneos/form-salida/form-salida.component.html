<div class="bg-stone-100 dark:bg-slate-900 border-2 border-black overflow-hidden flex flex-col w-full"
     style="max-width: min(700px, 95vw); box-shadow: 6px 6px 0 #000">

    <!-- HEADER -->
    <div class="bg-[#0F172A] px-4 py-3 flex items-center gap-3 shrink-0 select-none"
         cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle style="cursor:grab">
        <div class="w-8 h-8 rounded bg-amber-400 border-2 border-black flex items-center justify-center shadow-[2px_2px_0_#fbbf24] shrink-0">
            <mat-icon class="!text-base text-black">output</mat-icon>
        </div>
        <div>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.18em] leading-none mb-0.5">{{ subtitulo }}</p>
            <h2 class="text-sm text-white font-black uppercase tracking-tight leading-none">{{ titulo }}</h2>
        </div>
    </div>

    <!-- BODY -->
    <div class="px-3 py-3">
        <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-12 gap-3">

            <!-- CARD IZQUIERDA: Solicitante -->
            <div class="md:col-span-5 bg-white dark:bg-slate-800 border-2 border-black rounded-xl shadow-[3px_3px_0_#000] p-3 flex flex-col gap-2.5">

                <span class="text-[8px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-[0.18em] border-b-2 border-black/10 pb-1.5 block">
                    Solicitante
                </span>

                <!-- Área -->
                <div>
                    <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Área *</label>
                    <div class="relative">
                        <select formControlName="area"
                                class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 pr-8 outline-none transition-all duration-150 cursor-pointer appearance-none"
                                [class]="hasError('area','required')
                                    ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                    : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <option value="">— Seleccionar área —</option>
                            <option *ngFor="let a of areas" [value]="a">{{ a }}</option>
                        </select>
                        <mat-icon class="absolute right-2.5 top-1/2 -translate-y-1/2 !text-sm text-stone-400 pointer-events-none">expand_more</mat-icon>
                    </div>
                    <p *ngIf="hasError('area','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                </div>

                <!-- Funcionario solicitante -->
                <div class="relative">
                    <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 flex items-center justify-between">
                        <span class="flex items-center gap-1">
                            <mat-icon class="!text-[12px] text-amber-500">how_to_reg</mat-icon>
                            Funcionario *
                        </span>
                        <mat-spinner *ngIf="funcionarioLoading" diameter="14"></mat-spinner>
                    </label>
                    <input type="text"
                           [(ngModel)]="funcionarioName"
                           [ngModelOptions]="{standalone:true}"
                           [disabled]="readOnly"
                           (input)="onFuncionarioInput($any($event.target).value)"
                           (blur)="hideFuncionarioDropdown()"
                           placeholder="Buscar funcionario..."
                           autocomplete="off"
                           class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                    <div *ngIf="showFuncionarioDropdown"
                         class="absolute z-50 w-full mt-1 border-2 border-black dark:border-slate-500 rounded-xl bg-white dark:bg-slate-800 overflow-hidden shadow-[3px_3px_0_#000] divide-y divide-stone-100 dark:divide-slate-600">
                        <div *ngFor="let f of funcionarios"
                             (mousedown)="selectFuncionario(f)"
                             class="px-3 py-2.5 hover:bg-amber-50 dark:hover:bg-slate-700 cursor-pointer transition-colors">
                            <div class="text-xs font-black text-black dark:text-white uppercase leading-tight">{{ f.nombre }}</div>
                            <div class="text-[9px] font-bold text-stone-400 uppercase tracking-tighter">{{ f.cargo }}</div>
                        </div>
                    </div>
                </div>

                <!-- Nro. Licencia + Nro -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Nro. Licencia</label>
                        <input type="text" formControlName="nroLicencia" placeholder="Lic-001"
                               class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                    </div>
                    <div>
                        <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Nro.</label>
                        <input type="text" formControlName="nro" placeholder="001"
                               class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                    </div>
                </div>

                <!-- Observaciones -->
                <div class="border-t-2 border-black/10 pt-2">
                    <span class="text-[8px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-[0.18em] mb-2 block">Observaciones</span>
                    <textarea formControlName="observaciones" rows="2" placeholder="Notas adicionales..."
                              class="w-full text-sm font-normal bg-stone-50 dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 py-2.5 outline-none transition-all duration-150 resize-none placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]"></textarea>
                </div>

            </div>

            <!-- CARD DERECHA: Despacho -->
            <div class="md:col-span-7 bg-white dark:bg-slate-800 border-2 border-black rounded-xl shadow-[3px_3px_0_#000] p-3 flex flex-col gap-2.5">

                <span class="text-[8px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-[0.18em] border-b-2 border-black/10 pb-1.5 block">
                    Despacho
                </span>

                <!-- Nro. Nota + Fecha + Hora -->
                <div class="grid grid-cols-12 gap-2">
                    <div class="col-span-12 sm:col-span-4">
                        <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Nro. Nota *</label>
                        <input type="text" formControlName="nroNota" placeholder="NOTA-001"
                               class="w-full h-9 text-sm font-black uppercase bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                               [class]="hasError('nroNota','required')
                                   ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                   : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                        <p *ngIf="hasError('nroNota','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                    </div>
                    <div class="col-span-6 sm:col-span-4">
                        <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Fecha *</label>
                        <input type="date" formControlName="fecha"
                               class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                               [class]="hasError('fecha','required')
                                   ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                   : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                    </div>
                    <div class="col-span-6 sm:col-span-4">
                        <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Hora</label>
                        <input type="time" formControlName="hora"
                               class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                    </div>
                </div>

                <!-- Despachado Por (funcionario) -->
                <div class="relative">
                    <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 flex items-center justify-between">
                        <span class="flex items-center gap-1">
                            <mat-icon class="!text-[12px] text-amber-500">local_shipping</mat-icon>
                            Despachado Por *
                        </span>
                        <mat-spinner *ngIf="despachadoPorLoading" diameter="14"></mat-spinner>
                    </label>
                    <input type="text"
                           [(ngModel)]="despachadoPorName"
                           [ngModelOptions]="{standalone:true}"
                           [disabled]="readOnly"
                           (input)="onDespachadoInput($any($event.target).value)"
                           (blur)="hideDespachadoDropdown()"
                           placeholder="Buscar funcionario despachante..."
                           autocomplete="off"
                           class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                    <div *ngIf="showDespachadoPorDropdown"
                         class="absolute z-50 w-full mt-1 border-2 border-black dark:border-slate-500 rounded-xl bg-white dark:bg-slate-800 overflow-hidden shadow-[3px_3px_0_#000] divide-y divide-stone-100 dark:divide-slate-600">
                        <div *ngFor="let f of despachadoPorFuncionarios"
                             (mousedown)="selectDespachado(f)"
                             class="px-3 py-2.5 hover:bg-amber-50 dark:hover:bg-slate-700 cursor-pointer transition-colors">
                            <div class="text-xs font-black text-black dark:text-white uppercase leading-tight">{{ f.nombre }}</div>
                            <div class="text-[9px] font-bold text-stone-400 uppercase tracking-tighter">{{ f.cargo }}</div>
                        </div>
                    </div>
                </div>

                <!-- Material Despachado -->
                <div class="border-t-2 border-black/10 pt-2">
                    <span class="text-[8px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-[0.18em] mb-2 block">Material Despachado</span>
                    <div class="grid grid-cols-12 gap-2">
                        <div class="col-span-12 sm:col-span-5">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Código BOA-M *</label>
                            <input type="text" formControlName="codigoNombre" placeholder="BOA-M-001"
                                   class="w-full h-9 text-sm font-black uppercase bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                                   [class]="hasError('codigoNombre','required')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <p *ngIf="hasError('codigoNombre','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                        </div>
                        <div class="col-span-6 sm:col-span-4">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Cantidad *</label>
                            <input type="number" formControlName="cantidad" min="1"
                                   class="w-full h-9 text-sm font-black text-center bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150"
                                   [class]="hasError('cantidad','required') || hasError('cantidad','min')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <p *ngIf="hasError('cantidad','min')" class="text-[8px] font-bold text-red-500 mt-1">Mín. 1.</p>
                        </div>
                        <div class="col-span-6 sm:col-span-3">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Unidad *</label>
                            <div class="relative">
                                <select formControlName="unidad"
                                        class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 pr-7 outline-none transition-all duration-150 cursor-pointer appearance-none hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                                    <option *ngFor="let u of unidades" [value]="u">{{ u }}</option>
                                </select>
                                <mat-icon class="absolute right-2 top-1/2 -translate-y-1/2 !text-sm text-stone-400 pointer-events-none">expand_more</mat-icon>
                            </div>
                        </div>
                        <div class="col-span-12">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Descripción del Material *</label>
                            <input type="text" formControlName="producto" placeholder="Nombre completo del material"
                                   class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600"
                                   [class]="hasError('producto','required')
                                       ? 'border-red-400 focus:shadow-[2px_2px_0_#f87171]'
                                       : 'border-stone-300 dark:border-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]'">
                            <p *ngIf="hasError('producto','required')" class="text-[8px] font-bold text-red-500 mt-1">Requerido.</p>
                        </div>
                    </div>
                </div>

                <!-- Datos Adicionales -->
                <div class="border-t-2 border-black/10 pt-2">
                    <span class="text-[8px] font-black text-stone-400 dark:text-slate-400 uppercase tracking-[0.18em] mb-2 block">Datos Adicionales</span>
                    <div class="grid grid-cols-12 gap-2">
                        <div class="col-span-12 sm:col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Orden de Trabajo</label>
                            <input type="text" formControlName="ordenTrabajo" placeholder="OT-00000"
                                   class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                        <div class="col-span-12 sm:col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Stock Actual (referencia)</label>
                            <input type="text" formControlName="stock" placeholder="Stock antes de salida"
                                   class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                        <div class="col-span-12 sm:col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Aeronave</label>
                            <input type="text" formControlName="buscadorAeronave" placeholder="Matrícula / Tail"
                                   class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                        <div class="col-span-12 sm:col-span-6">
                            <label class="text-[8px] font-black uppercase tracking-[0.18em] text-stone-400 dark:text-slate-400 mb-1.5 block">Autorizado Por</label>
                            <input type="text" formControlName="buscadorAutorizado" placeholder="Nombre del autorizante"
                                   class="w-full h-9 text-sm font-bold bg-white dark:bg-slate-900 dark:text-white border-2 border-stone-300 dark:border-slate-600 rounded-xl px-3 outline-none transition-all duration-150 placeholder:text-stone-300 dark:placeholder:text-slate-600 hover:border-stone-400 dark:hover:border-slate-500 focus:border-black dark:focus:border-slate-400 focus:shadow-[3px_3px_0_#000]">
                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>

    <!-- FOOTER -->
    <div class="border-t-2 border-black bg-stone-200 dark:bg-slate-800 px-4 py-3 flex justify-between items-center shrink-0">
        <button type="button" (click)="dialogRef.close(undefined)"
                class="px-4 py-2 bg-[#FF1414] text-white font-black text-[10px] border-2 border-black rounded-xl shadow-[2px_2px_0_#000] hover:shadow-none hover:translate-x-[2px] hover:translate-y-[2px] transition-all uppercase">
            {{ readOnly ? 'Cerrar' : 'Cancelar' }}
        </button>
        <button *ngIf="!readOnly" type="button" (click)="save()"
                class="flex items-center gap-2 px-5 py-2 bg-amber-400 text-black font-black text-[10px] border-2 border-black rounded-xl shadow-[3px_3px_0_#000] hover:shadow-none hover:translate-x-[3px] hover:translate-y-[3px] transition-all uppercase">
            <mat-icon class="!text-sm !text-black">save</mat-icon>
            Registrar Salida
        </button>
    </div>
</div>
