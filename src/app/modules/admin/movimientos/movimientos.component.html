<!-- ══════════════════════════════════════════════════════════════════
     MOVIMIENTOS — Shell unificado (INTER-BASES · ENTRADAS · SALIDAS)
══════════════════════════════════════════════════════════════════ -->

<div class="relative flex flex-col w-full h-full bg-white dark:bg-[#0F172AFF] transition-colors duration-300 font-sans overflow-hidden">

  <!-- ─────────────────────── TOP BAR ──────────────────────────── -->
  <div class="flex items-center gap-3 px-4 sm:px-6 py-3 border-b-[3px] border-black shrink-0 bg-white dark:bg-slate-900 relative z-[110]">

    <div class="flex items-center gap-2 shrink-0">
      <div class="w-9 h-9 flex items-center justify-center rounded-xl border-[3px] border-black bg-[#0F172AFF] shadow-[3px_3px_0_0_#000] shrink-0">
        <mat-icon svgIcon="heroicons_outline:arrows-right-left" class="!text-base text-[#FFC501FF]"></mat-icon>
      </div>
      <div>
        <h1 class="text-lg sm:text-2xl font-black text-black dark:text-white uppercase tracking-tighter leading-none">MOVIMIENTOS</h1>
        <p class="text-[9px] font-bold bg-[#FFC501FF] text-black px-2 py-0.5 rounded border-2 border-black inline-block uppercase tracking-wider mt-0.5">
          Inter-Bases · Entradas · Salidas
        </p>
      </div>
    </div>

    <div class="flex-1"></div>

    <!-- Quick-open buttons -->
    <button (click)="openModule(10)"
            [ngClass]="isTabOpen(10) ? '!bg-[#FFC501FF] !text-black' : ''"
            class="flex items-center gap-1.5 h-9 px-3 sm:px-4 rounded-xl border-[2px] border-black bg-[#0F172AFF] hover:bg-[#1e293b] text-white font-black text-[10px] uppercase shadow-[3px_3px_0_0_#000] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none transition-all shrink-0">
      <mat-icon svgIcon="heroicons_outline:arrows-right-left" class="!text-sm !w-4 !h-4"></mat-icon>
      <span class="hidden sm:inline">Inter-Bases</span>
    </button>
  </div>

  <!-- ─────────────────── OPEN-MODULE TAB BAR ───────────────────── -->
  <div *ngIf="openTabs.length > 0"
       class="flex items-center gap-0.5 px-3 py-2 bg-gray-100 dark:bg-slate-800 border-b-[2px] border-black overflow-x-auto scrollbar-none shrink-0 custom-scrollbar">

    <!-- Back to launcher -->
    <button (click)="activeTabId = null"
            class="flex items-center gap-1 h-8 px-3 rounded-lg border-[2px] text-[10px] font-black uppercase transition-all shrink-0 mr-1"
            [ngClass]="activeTabId===null
              ? 'bg-[#0F172AFF] text-[#FFC501FF] border-black shadow-none'
              : 'bg-white dark:bg-slate-700 text-black dark:text-white border-black shadow-[2px_2px_0_#000] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none'">
      <mat-icon class="!text-sm !w-4 !h-4">grid_view</mat-icon>
      <span class="hidden sm:inline">Módulos</span>
    </button>

    <!-- Divider -->
    <div class="w-px h-6 bg-black/20 dark:bg-white/20 mx-1 shrink-0"></div>

    <!-- Open tabs -->
    <button *ngFor="let tab of openTabs; trackBy: trackByTabId"
            (click)="setActiveTab(tab.id)"
            class="flex items-center gap-1.5 h-8 px-3 rounded-lg border-[2px] border-black text-[10px] font-black uppercase transition-all max-w-[180px] shrink-0 group"
            [ngClass]="activeTabId === tab.id
              ? 'text-white shadow-none translate-x-[1px] translate-y-[1px]'
              : 'bg-white dark:bg-slate-700 text-black dark:text-white shadow-[2px_2px_0_#000] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none'"
            [style.background-color]="activeTabId === tab.id ? tab.color : ''">
      <mat-icon [svgIcon]="tab.svgIcon" class="!text-sm !w-4 !h-4 shrink-0"
                [style.color]="activeTabId === tab.id ? tab.textColor : ''"></mat-icon>
      <span class="truncate flex-1 text-left leading-none"
            [style.color]="activeTabId === tab.id ? tab.textColor : ''">{{tab.label}}</span>
      <span class="text-[9px] opacity-60 hidden md:block shrink-0 ml-0.5"
            [style.color]="activeTabId === tab.id ? tab.textColor : ''">{{tab.sublabel}}</span>
      <span (click)="closeTab(tab.id, $event)"
            class="w-4 h-4 flex items-center justify-center rounded hover:bg-red-500 hover:text-white ml-1 shrink-0 transition-colors opacity-0 group-hover:opacity-100"
            [style.color]="activeTabId === tab.id ? tab.textColor : ''">
        <mat-icon class="!text-[11px] !w-3 !h-3">close</mat-icon>
      </span>
    </button>
  </div>

  <!-- ─────────────────── LAUNCHER (module grid) ────────────────── -->
  <div *ngIf="activeTabId === null" class="flex-1 flex flex-col overflow-hidden">

    <!-- Category tab bar -->
    <div class="flex items-end gap-0 px-4 pt-3 shrink-0 border-b-[3px] border-black bg-white dark:bg-slate-900 overflow-x-auto scrollbar-none">
      <button *ngFor="let cat of categories"
              (click)="setCategory(cat.id)"
              class="flex items-center gap-2 h-9 px-4 sm:px-5 border-[2px] border-b-0 rounded-t-xl font-black text-[11px] uppercase transition-all shrink-0 relative -mb-[3px]"
              [ngClass]="activeCategory === cat.id
                ? 'bg-white dark:bg-slate-800 text-black dark:text-white border-black z-10'
                : 'bg-stone-200 dark:bg-slate-700 text-stone-500 dark:text-slate-400 border-stone-300 dark:border-slate-600 hover:bg-stone-100 dark:hover:bg-slate-600'">
        <mat-icon [svgIcon]="cat.svgIcon" class="!text-sm !w-4 !h-4"></mat-icon>
        <span>{{cat.label}}</span>
        <span class="ml-1 px-1.5 py-0.5 rounded text-[9px] font-black border"
              [ngClass]="activeCategory === cat.id
                ? 'bg-[#0F172AFF] text-[#FFC501FF] border-black'
                : 'bg-stone-300 dark:bg-slate-600 text-stone-600 dark:text-slate-300 border-stone-400'">
          {{getModulesForCategory(cat.id).length}}
        </span>
      </button>
    </div>

    <!-- Module cards panel -->
    <div class="flex-1 overflow-y-auto custom-scrollbar bg-[#f8f9fc] dark:bg-[#0F172AFF] animate-fadeIn" [attr.data-cat]="activeCategory">

      <!-- Category header -->
      <div class="px-6 py-4 border-b-2 border-black/10 dark:border-white/10" [ngSwitch]="activeCategory">
        <ng-container *ngSwitchCase="'inter-bases'">
          <p class="text-xs font-black uppercase text-stone-500 dark:text-slate-400 tracking-widest">
            Gestión de movimientos entre bases · Envíos, traspasos, retornos y documentos MGH-109
          </p>
        </ng-container>
        <ng-container *ngSwitchCase="'entradas'">
          <p class="text-xs font-black uppercase text-stone-500 dark:text-slate-400 tracking-widest">
            Registro de ingresos al almacén · Nuevas herramientas, ajustes y devoluciones
          </p>
        </ng-container>
        <ng-container *ngSwitchCase="'salidas'">
          <p class="text-xs font-black uppercase text-stone-500 dark:text-slate-400 tracking-widest">
            Control de salidas del almacén · Préstamos, cuarentenas y bajas de activos
          </p>
        </ng-container>
      </div>

      <!-- Cards grid -->
      <div class="p-5 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        <button *ngFor="let mod of getModulesForCategory()"
                (click)="openModule(mod.type)"
                class="mod-card group relative flex flex-col items-center justify-center gap-3 p-5 rounded-2xl border-[3px] border-black bg-white dark:bg-slate-800 transition-all text-center cursor-pointer"
                [style.box-shadow]="isTabOpen(mod.type) ? '2px 2px 0 0 #000' : '4px 4px 0 0 #000'"
                [style.transform]="isTabOpen(mod.type) ? 'translate(2px,2px)' : ''"
                [style.background-color]="isTabOpen(mod.type) ? '#FFC501' : ''">

          <!-- Open indicator -->
          <div *ngIf="isTabOpen(mod.type)"
               class="absolute top-2 right-2 w-2 h-2 rounded-full bg-green-500 border border-black"
               matTooltip="Módulo abierto"></div>

          <!-- Icon circle -->
          <div class="w-14 h-14 rounded-xl border-[3px] border-black flex items-center justify-center shadow-[2px_2px_0_0_#000] shrink-0"
               [style.background-color]="mod.color">
            <mat-icon [svgIcon]="mod.svgIcon"
                      class="mod-icon !w-7 !h-7 !text-2xl"
                      [style.color]="mod.textColor"></mat-icon>
          </div>

          <!-- Text -->
          <div class="leading-tight">
            <div class="text-xs font-black uppercase text-black leading-tight">{{mod.label}}</div>
            <div class="text-[10px] font-bold uppercase leading-tight mt-0.5"
                 [ngClass]="isTabOpen(mod.type) ? 'text-black/60' : 'text-stone-400 dark:text-slate-400'">
              {{mod.sublabel}}
            </div>
          </div>

          <!-- Hover badge -->
          <div class="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="bg-black text-[#FFC501FF] text-[9px] font-black px-1.5 py-0.5 rounded border border-black uppercase">
              {{isTabOpen(mod.type) ? 'Ver' : 'Abrir'}}
            </span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- ──────────────── ACTIVE SUB-MODULE VIEW ───────────────────── -->
  <div *ngIf="activeTabId !== null" class="flex-1 overflow-hidden relative bg-[#f8f9fc] dark:bg-[#0F172AFF]">
    <div *ngFor="let tab of openTabs; trackBy: trackByTabId"
         [class.hidden]="tab.id !== activeTabId"
         class="w-full h-full flex flex-col overflow-hidden">
      <ng-container *ngComponentOutlet="tab.component; injector: tab.injector"></ng-container>
    </div>
  </div>

</div>
